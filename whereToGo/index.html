<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>石家庄周边游 · 筛选 & 随机转盘</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --primary: #2f6f4f;
    --primary-light: #e8f3ec;
    --accent: #e07a3f;
    --bg: #f7f6f2;
    --card: #ffffff;
    --text: #2b2b2b;
    --muted: #7a7a72;
    --border: #e5e3db;
  }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    background: linear-gradient(135deg, #2f6f4f 0%, #3d8a63 60%, #56a379 100%);
    color: #fff;
    padding: 26px 32px;
  }
  header h1 { font-size: 24px; letter-spacing: 1px; }
  header p { margin-top: 6px; opacity: .85; font-size: 13px; }
  .layout {
    display: grid;
    grid-template-columns: 300px 1fr 420px;
    gap: 20px;
    padding: 20px 32px;
    max-width: 1500px;
    margin: 0 auto;
  }
  @media (max-width: 1200px) {
    .layout { grid-template-columns: 1fr; }
  }
  .panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    height: fit-content;
    position: sticky;
    top: 16px;
  }
  .panel h2 {
    font-size: 15px;
    margin-bottom: 12px;
    color: var(--primary);
    border-bottom: 2px solid var(--primary-light);
    padding-bottom: 8px;
  }
  .filter-group { margin-bottom: 16px; }
  .filter-group label.group-title {
    display: block; font-size: 13px; font-weight: bold; margin-bottom: 8px; color: #444;
  }
  .check-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 12.5px; padding: 5px 10px; border-radius: 999px;
    border: 1px solid var(--border); background: #fff; cursor: pointer;
    user-select: none; transition: all .15s;
  }
  .chip.on {
    background: var(--primary-light); border-color: var(--primary); color: var(--primary); font-weight: bold;
  }
  input[type=range] { width: 100%; accent-color: var(--primary); }
  .range-val { font-size: 13px; color: var(--primary); font-weight: bold; }
  select, input[type=text] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border);
    border-radius: 8px; font-size: 13px; background: #fff;
  }
  .toggle-row { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .btn {
    display: inline-block; border: none; cursor: pointer; border-radius: 10px;
    padding: 10px 18px; font-size: 14px; font-weight: bold; transition: all .15s;
  }
  .btn-reset { background: #eee; color: #666; }
  .btn-reset:hover { background: #e0e0e0; }
  .btn-spin {
    background: var(--accent); color: #fff; font-size: 18px; padding: 14px 40px;
    border-radius: 999px; box-shadow: 0 4px 14px rgba(224,122,63,.4);
  }
  .btn-spin:hover:not(:disabled) { transform: scale(1.04); }
  .btn-spin:disabled { opacity: .5; cursor: not-allowed; }
  .results { display: flex; flex-direction: column; gap: 10px; }
  .result-head {
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;
  }
  .result-head .count { font-size: 13px; color: var(--muted); }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 14px; display: flex; justify-content: space-between; gap: 10px;
    align-items: flex-start; transition: box-shadow .15s;
  }
  .card:hover { box-shadow: 0 3px 12px rgba(0,0,0,.07); }
  .card .name { font-size: 15px; font-weight: bold; }
  .card .meta { font-size: 12.5px; color: var(--muted); margin-top: 4px; line-height: 1.7; }
  .tag {
    display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px;
    background: var(--primary-light); color: var(--primary); margin-right: 4px;
  }
  .tag.free { background: #fdf0e6; color: #b35a1f; }
  .card .dist-box { text-align: right; min-width: 90px; flex-shrink: 0; }
  .card .dist { font-size: 16px; font-weight: bold; color: var(--primary); }
  .card .drive { font-size: 12px; color: var(--muted); }
  /* ===== 右侧待选区：占满整栏 ===== */
  .wheel-panel {
    text-align: center;
    display: flex; flex-direction: column;
    height: calc(100vh - 140px);
    min-height: 420px;
    overflow: hidden;
  }
  .wheel-panel .cand-list {
    flex: 1; max-height: none; min-height: 0;
  }
  .wheel-panel .spin-area {
    margin-top: 12px; padding-top: 12px;
    border-top: 2px solid var(--primary-light);
  }
  .panel-winner { margin-top: 10px; font-size: 13px; color: var(--muted); min-height: 18px; }
  .panel-winner b { color: var(--accent); font-size: 15px; }

  /* ===== 全屏转盘弹窗 ===== */
  .wheel-modal {
    display: none;
    position: fixed; inset: 0; z-index: 100;
    background: radial-gradient(ellipse at center, rgba(28,58,44,.96) 0%, rgba(12,26,20,.98) 100%);
    flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; padding: 14px; overflow: hidden;
  }
  .wheel-modal.open { display: flex; }
  .modal-close {
    position: absolute; top: 18px; right: 22px; z-index: 10;
    border: 1px solid rgba(255,255,255,.3); background: rgba(255,255,255,.08);
    color: #fff; font-size: 20px; width: 44px; height: 44px; border-radius: 50%;
    cursor: pointer; transition: all .15s;
  }
  .modal-close:hover { background: rgba(255,255,255,.2); transform: rotate(90deg); }
  .modal-title { color: #ffd97a; font-size: 17px; font-weight: bold; letter-spacing: 2px; flex-shrink: 0; }
  .wheel-wrap {
    position: relative;
    /* 宽高锁定同一个值 + 强制 1:1 比例，任何屏幕下都是正圆 */
    width: min(92vmin, calc(100vh - 180px), 880px);
    aspect-ratio: 1 / 1;
    height: auto;
    margin: 0 auto; flex-shrink: 0; /* 转盘尺寸锁定，不因开奖文字挤压变形 */
  }
  .wheel-modal canvas { width: 100%; height: 100%; }
  .wheel-modal .wheel-wrap { margin-top: 26px; } /* 给顶部指针留空间，避免压到标题 */
  .wheel-modal .spin-area { margin-top: 0; flex-shrink: 0; }
  /* 开奖结果：全屏居中悬浮层，不挤占转盘空间 */
  .wheel-modal .winner {
    position: fixed; inset: 0; z-index: 30;
    display: flex; align-items: center; justify-content: center;
    margin: 0; min-height: 0; pointer-events: none;
  }
  .wheel-modal .winner:empty { display: none; }
  .wheel-modal .winner .w-card {
    pointer-events: auto;
    background: rgba(10, 26, 19, .88);
    border: 2px solid #ffd97a; border-radius: 18px;
    box-shadow: 0 0 40px rgba(255, 205, 90, .35);
    padding: 26px 48px; text-align: center;
    max-width: min(80vw, 640px);
    animation: popIn .45s cubic-bezier(.2, 1.4, .4, 1);
  }
  @keyframes popIn {
    0% { transform: scale(.6); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  .wheel-modal .winner { font-size: 20px; }
  .wheel-modal .winner .w-name { font-size: 44px; margin-top: 6px; }
  .wheel-modal .winner .w-info { font-size: 16px; color: #cfe0d4; margin-top: 10px; }
  .pointer {
    position: absolute; top: -6px; left: 50%; transform: translateX(-50%);
    width: 0; height: 0; z-index: 5;
    border-left: 14px solid transparent; border-right: 14px solid transparent;
    border-top: 26px solid var(--accent);
    filter: drop-shadow(0 2px 3px rgba(0,0,0,.25));
  }
  .pointer::after {
    content: ""; position: absolute; left: -7px; top: -26px;
    width: 14px; height: 10px; background: var(--accent); border-radius: 4px 4px 0 0;
  }
  canvas { display: block; }
  .wheel-empty {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 14px; text-align: center; padding: 0 50px;
  }
  .spin-area { margin-top: 14px; }
  .winner {
    margin-top: 14px; font-size: 16px; min-height: 48px; text-align: center;
  }
  .wheel-modal .winner { color: #fff; margin-top: 6px; }
  .winner .w-name {
    font-size: 22px; font-weight: bold; color: var(--accent);
  }
  .winner .w-info { font-size: 13px; color: var(--muted); margin-top: 4px; line-height: 1.6; }
  .cap-hint {
    display: none;
    margin-top: 10px;
    padding: 8px 12px;
    font-size: 12.5px;
    line-height: 1.6;
    color: #8a5a1f;
    background: #fdf3e3;
    border: 1px solid #f0d9b0;
    border-radius: 8px;
  }
  .hub-center {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    width: 54px; height: 54px; border-radius: 50%; background: #fff;
    border: 4px solid var(--primary); z-index: 4;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; box-shadow: 0 2px 8px rgba(0,0,0,.15);
  }
  .empty-tip { color: var(--muted); font-size: 13px; padding: 20px 0; }
  /* ===== 光影特效 ===== */
  .wheel-wrap.spinning canvas {
    filter: drop-shadow(0 0 16px rgba(224,122,63,.65));
  }
  .wheel-wrap.spinning .pointer {
    filter: drop-shadow(0 0 10px rgba(255,180,70,.95));
  }
  .wheel-wrap.flash {
    animation: winflash 1s ease-out 2;
  }
  @keyframes winflash {
    0%   { filter: drop-shadow(0 0 36px rgba(255,205,90,.95)) brightness(1.35); }
    100% { filter: drop-shadow(0 0 4px rgba(255,205,90,0)) brightness(1); }
  }
  /* ===== 勾选 / 随机抽 / 待选区 ===== */
  .card.pickable { cursor: pointer; }
  .card .pick-box {
    margin-top: 3px; transform: scale(1.35); accent-color: var(--primary); flex-shrink: 0;
  }
  .rand-row { display: flex; gap: 8px; }
  .rand-row input[type=number] {
    width: 70px; padding: 8px 10px; border: 1px solid var(--border);
    border-radius: 8px; font-size: 13px;
  }
  .btn-rand { background: var(--primary); color: #fff; flex: 1; padding: 8px 12px; }
  .btn-rand:hover { background: #275d41; }
  .cand-list {
    max-height: 210px; overflow-y: auto; text-align: left;
    display: flex; flex-direction: column; gap: 6px; margin-bottom: 6px;
  }
  .cand-item {
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
    background: var(--primary-light); border-radius: 8px; padding: 6px 10px; font-size: 13px;
  }
  .cand-item .cand-name { font-weight: bold; }
  .cand-item .cand-meta { color: var(--muted); font-size: 11.5px; }
  .cand-del {
    border: none; background: transparent; color: #c0605a; cursor: pointer;
    font-size: 15px; padding: 0 4px; flex-shrink: 0;
  }
  .cand-del:hover { color: #a03028; }
  .cand-empty { color: var(--muted); font-size: 12.5px; text-align: center; padding: 12px 6px; }
  .cand-count { font-size: 12px; color: var(--muted); font-weight: normal; }
  footer {
    text-align: center; color: #aaa; font-size: 12px; padding: 24px 0 30px;
  }
</style>
</head>
<body>

<header>
  <h1>🧭 石家庄周边游 · 筛选 & 随机转盘</h1>
  <p>131 个景点 · 河北 + 山西 + 河南 | 按城市、类型、距离、天数筛选 → 转盘帮你做决定！</p>
</header>

<div class="layout">
  <!-- 左侧：筛选 -->
  <div class="panel">
    <h2>🎯 筛选条件</h2>
    <div class="filter-group">
      <label class="group-title">省份</label>
      <select id="provinceSelect"><option value="all">全部省份</option></select>
    </div>
    <div class="filter-group">
      <label class="group-title">城市</label>
      <select id="citySelect"><option value="all">全部城市</option></select>
    </div>
    <div class="filter-group">
      <label class="group-title">景点类型</label>
      <select id="typeSelect"><option value="all">全部类型</option></select>
    </div>
    <div class="filter-group">
      <label class="group-title">最大距离：<span class="range-val" id="distVal">700 km</span></label>
      <input type="range" id="distRange" min="0" max="700" step="10" value="700">
    </div>
    <div class="filter-group">
      <label class="group-title">建议游玩天数</label>
      <select id="daysSelect">
        <option value="all">不限</option>
        <option value="0.5">半天（0.5天）</option>
        <option value="1">1天（当天往返）</option>
        <option value="2">2天（过周末）</option>
        <option value="3">3天（小长假）</option>
      </select>
    </div>
    <div class="filter-group">
      <label class="group-title">关键字搜索</label>
      <input type="text" id="searchBox" placeholder="如：温泉、古镇、滑雪…">
    </div>
    <div class="filter-group toggle-row">
      <input type="checkbox" id="freeOnly"> <label for="freeOnly">只看免费景点</label>
    </div>
    <div class="filter-group">
      <label class="group-title">随机抽 X 个加入待选区</label>
      <div class="rand-row">
        <input type="number" id="randCount" value="3" min="1" max="99">
        <button class="btn btn-rand" id="randPickBtn">🎲 随机选</button>
      </div>
    </div>
    <button class="btn btn-reset" id="resetBtn">↺ 重置筛选条件</button>
  </div>

  <!-- 中间：结果列表 -->
  <div>
    <div class="result-head">
      <h2 style="font-size:16px;">📋 符合条件的景点</h2>
      <span class="count" id="countText"></span>
    </div>
    <div class="results" id="resultList"></div>
  </div>

  <!-- 右侧：待选区（占满整栏）+ 开始转按钮 -->
  <div class="panel wheel-panel">
    <h2>⭐ 待选区 <span class="cand-count" id="candCount"></span></h2>
    <div class="cand-list" id="candList"></div>
    <div class="cap-hint" id="panelCapHint" style="display:none;"></div>
    <div class="spin-area">
      <button class="btn btn-spin" id="openSpinBtn">🎡 开始转！</button>
      <div class="panel-winner" id="panelWinner"></div>
    </div>
  </div>
</div>

<footer>数据整理自携程 / 同程 / 石家庄市文广旅局公开信息 · 距离与时长为市区出发自驾估算，出行前请再核实</footer>

<!-- 全屏转盘弹窗 -->
<div class="wheel-modal" id="wheelModal">
  <button class="modal-close" id="modalClose" title="关闭">✕</button>
  <div class="modal-title">🎡 幸运转盘</div>
  <div class="wheel-wrap">
    <div class="pointer"></div>
    <canvas id="wheel" width="800" height="800"></canvas>
    <div class="wheel-empty" id="wheelEmpty" style="display:none;">待选区还是空的<br>先去勾选或随机抽取景点吧～</div>
    <div class="hub-center">🎲</div>
  </div>
  <div class="cap-hint" id="wheelCapHint" style="display:none;"></div>
  <div class="spin-area">
    <button class="btn btn-spin" id="spinBtn">开始转！</button>
  </div>
  <div class="winner" id="winnerBox"></div>
</div>

<script>
// ⚠️ 下方 DATA 数据块由 build.py 从 attractions.json 自动生成，请勿手改；
//    修改景点数据请编辑 attractions.json，然后运行：python build.py
const DATA = [
  {"name":"河北博物院","city":"石家庄市区","type":"历史人文","features":"了解河北历史；长信宫灯、金缕玉衣等镇馆之宝","distance":0,"drive":15,"days":0.5,"ticket":"免费","isFree":true,"note":"周一闭馆 需预约"},
  {"name":"正太广场(正太饭店)","city":"石家庄市区","type":"历史人文","features":"石家庄现存最早的法国古典主义建筑、城市原点","distance":2,"drive":10,"days":0.5,"ticket":"免费","isFree":true,"note":"市区打卡"},
  {"name":"湾里庙步行街·火车头步行街","city":"石家庄市区","type":"美食街区","features":"石家庄最老商业街+老火车站主题街区，小吃集中","distance":2,"drive":10,"days":0.5,"ticket":"免费","isFree":true,"note":"晚上更热闹"},
  {"name":"滹沱河艺术生态岛","city":"石家庄市区","type":"亲子休闲","features":"滹沱河最大天然岛，滨水休闲/野奢营地/亲子互动","distance":12,"drive":25,"days":1,"ticket":"免费(项目另收费)","isFree":true,"note":"适合露营野餐"},
  {"name":"抱犊寨","city":"石家庄鹿泉区","type":"自然山水","features":"山势陡峻的军事山寨，可登山或坐索道俯瞰市区","distance":20,"drive":40,"days":1,"ticket":"57元(索道另收费)","isFree":false,"note":"爬山强度中等"},
  {"name":"石家庄市动物园","city":"石家庄鹿泉区","type":"亲子休闲","features":"观赏珍禽异兽，毗邻辛玛王国游乐园","distance":15,"drive":30,"days":1,"ticket":"30元","isFree":false,"note":"适合带娃"},
  {"name":"龙泉古镇·戏剧幻城","city":"石家庄鹿泉区","type":"古镇古村","features":"明清民国老建筑集群+沉浸式演出+飞行影院","distance":15,"drive":30,"days":1,"ticket":"98元起","isFree":false,"note":"夜景好看"},
  {"name":"西部长青休博城(德明古镇)","city":"石家庄鹿泉区","type":"温泉度假","features":"德明古镇+室内外滑雪场+温泉谷，冬夏都好玩","distance":20,"drive":40,"days":1,"ticket":"古镇免费 滑雪温泉另收费","isFree":true,"note":"可玩一整天"},
  {"name":"正定古城(南城门)","city":"石家庄正定县","type":"古镇古村","features":"千年古城墙、夜景灯光秀、夜市小吃","distance":17,"drive":35,"days":1,"ticket":"免费","isFree":true,"note":"傍晚去最好"},
  {"name":"隆兴寺","city":"石家庄正定县","type":"历史人文","features":"始建于隋朝的皇家寺庙，宋代彩塑倒坐观音","distance":18,"drive":40,"days":0.5,"ticket":"50元","isFree":false,"note":"京外名刹之首"},
  {"name":"正定荣国府","city":"石家庄正定县","type":"历史人文","features":"红楼梦取景地，87版《红楼梦》影视基地","distance":18,"drive":40,"days":0.5,"ticket":"38元","isFree":false,"note":"晚上有夜场"},
  {"name":"赵云庙","city":"石家庄正定县","type":"历史人文","features":"常山赵子龙故里纪念庙宇","distance":18,"drive":40,"days":0.5,"ticket":"20元","isFree":false,"note":"可与荣国府同游"},
  {"name":"正定热雪奇迹","city":"石家庄正定县","type":"滑雪冰雪","features":"室内滑雪场，一年四季可滑","distance":20,"drive":40,"days":1,"ticket":"248元起(3小时)","isFree":false,"note":"夏天也能滑雪"},
  {"name":"赵州桥","city":"石家庄赵县","type":"历史人文","features":"世界现存最古老的敞肩式石拱桥，课本里的桥","distance":45,"drive":60,"days":0.5,"ticket":"35元左右","isFree":false,"note":"与柏林禅寺同游"},
  {"name":"柏林禅寺","city":"石家庄赵县","type":"历史人文","features":"1800年古刹，赵州祖庭，古柏苍翠","distance":45,"drive":60,"days":0.5,"ticket":"免费","isFree":true,"note":"氛围安静"},
  {"name":"赵县梨园小镇","city":"石家庄赵县","type":"亲子休闲","features":"万亩梨园，春天梨花如雪，秋天摘梨","distance":55,"drive":72,"days":0.5,"ticket":"免费","isFree":true,"note":"4月赏梨花最佳"},

// ---------- 网络下载的自定义景点（localStorage 持久化） ----------
let customData = [];
try { customData = JSON.parse(localStorage.getItem("sjz_custom_data") || "[]"); } catch (e) { customData = []; }
customData.forEach(d => DATA.push(d));

// ---------- 状态 ----------
const state = { province: "all", city: "all", type: "all", maxDist: 700, days: "all", search: "", freeOnly: false };
const WHEEL_CAP = 20; // 转盘最多放的扇区数

// ---------- 省市解析 ----------
function provinceOf(cityStr) {
  return cityStr.startsWith("山西") ? "山西" : cityStr.startsWith("河南") ? "河南" : "河北";
}
function baseCityOf(cityStr) {
  const s = cityStr.replace(/^(山西|河南)/, "");
  return ["石家庄", "秦皇岛", "张家口"].includes(s.slice(0, 3)) ? s.slice(0, 3) : s.slice(0, 2);
}

// ---------- 待选区 ----------
let candidates = []; // 进入转盘的景点（引用 DATA 条目）
try {
  const saved = JSON.parse(localStorage.getItem("sjz_candidates") || "[]");
  candidates = saved.map(n => DATA.find(d => d.name === n)).filter(Boolean);
} catch (e) { candidates = []; }
function saveCands() {
  try { localStorage.setItem("sjz_candidates", JSON.stringify(candidates.map(d => d.name))); } catch (e) {}
}
function inCands(d) { return candidates.some(c => c.name === d.name); }
function toggleCand(d, on) {
  if (on && !inCands(d)) candidates.push(d);
  if (!on) candidates = candidates.filter(c => c.name !== d.name);
  saveCands();
  render(); // 重新渲染结果勾选态 + 待选区 + 转盘
}

// ---------- 下拉框初始化 ----------
const types = [...new Set(DATA.map(d => d.type))];
const provinceSel = document.getElementById("provinceSelect");
const citySel = document.getElementById("citySelect");
const typeSel = document.getElementById("typeSelect");
[...new Set(DATA.map(d => provinceOf(d.city)))].forEach(p => provinceSel.add(new Option(p, p)));
types.forEach(t => typeSel.add(new Option(t, t)));
function refreshCityOptions() {
  citySel.innerHTML = '<option value="all">全部城市</option>';
  DATA.filter(d => state.province === "all" || provinceOf(d.city) === state.province)
      .map(d => baseCityOf(d.city))
      .filter((v, i, a) => a.indexOf(v) === i)
      .sort()
      .forEach(c => citySel.add(new Option(c, c)));
}
refreshCityOptions();

// ---------- 筛选逻辑 ----------
function filtered() {
  return DATA.filter(d => {
    if (state.province !== "all" && provinceOf(d.city) !== state.province) return false;
    if (state.city !== "all" && baseCityOf(d.city) !== state.city) return false;
    if (state.type !== "all" && d.type !== state.type) return false;
    if (d.distance > state.maxDist) return false;
    if (state.days !== "all" && d.days > parseFloat(state.days)) return false;
    if (state.freeOnly && !d.isFree) return false;
    if (state.search) {
      const kw = state.search.toLowerCase();
      const hay = (d.name + d.city + d.type + d.features + d.note).toLowerCase();
      if (!hay.includes(kw)) return false;
    }
    return true;
  }).sort((a, b) => a.distance - b.distance);
}

// ---------- 渲染列表 ----------
function render() {
  const list = filtered();
  document.getElementById("countText").textContent = "共 " + list.length + " 个";
  const box = document.getElementById("resultList");
  box.innerHTML = "";
  if (!list.length) {
    if (state.search && state.search.length >= 2) {
      // 本地无结果 → 联网查询（有缓存不重复请求）
      box.innerHTML = '<div class="empty-tip">😅 本地没有「' + state.search + '」</div>' +
        '<div id="webBox"><div class="empty-tip">🌐 正在联网查询「' + state.search + '」…</div></div>';
      if (webCache.kw === state.search) {
        document.getElementById("webBox").innerHTML = webResultsHTML(webCache.items);
        bindWebButtons();
      } else {
        webSearch(state.search);
      }
    } else {
      box.innerHTML = '<div class="empty-tip">😅 没有符合条件的景点，放宽点条件试试～</div>';
    }
  }
  list.forEach(d => {
    const card = document.createElement("div");
    card.className = "card pickable";
    card.innerHTML =
      '<input type="checkbox" class="pick-box" title="加入/移出待选区" ' + (inCands(d) ? "checked" : "") + '>' +
      '<div><div class="name">' + d.name + '</div>' +
      '<div class="meta">' +
        '<span class="tag">' + d.type + '</span>' +
        (d.isFree ? '<span class="tag free">免费</span>' : '') +
        '<span class="tag">' + d.city + '</span><br>' +
        d.features + '<br>' +
        '⏱ 建议 ' + (d.days < 1 ? "半天" : d.days + " 天") + ' ｜ 🎫 ' + d.ticket +
        (d.note ? ' ｜ 💡 ' + d.note : '') +
      '</div></div>' +
      '<div class="dist-box"><div class="dist">' + d.distance + ' km</div>' +
      '<div class="drive">车程约 ' + (d.drive >= 60 ? Math.floor(d.drive/60) + '小时' + (d.drive%60 ? (d.drive%60) + '分' : '') : d.drive + '分钟') + '</div></div>';
    card.querySelector(".pick-box").onchange = e => toggleCand(d, e.target.checked);
    box.appendChild(card);
  });
  renderCandidates();
  drawWheel(candidates);
}

// 转盘容量提示：待选区超出 WHEEL_CAP 时明确告知，不再静默截断
function setCapHint(el, total) {
  if (!el) return;
  if (total > WHEEL_CAP) {
    el.textContent = "⚠️ 待选区共 " + total + " 个，转盘最多放 " + WHEEL_CAP + " 个，仅按添加顺序的前 " + WHEEL_CAP + " 个参与；想换一批可先在待选区删掉几个再转。";
    el.style.display = "block";
  } else {
    el.style.display = "none";
  }
}

// ---------- 待选区渲染 ----------
function renderCandidates() {
  const box = document.getElementById("candList");
  document.getElementById("candCount").textContent = "（" + candidates.length + " 个，进转盘）";
  setCapHint(document.getElementById("panelCapHint"), candidates.length);
  box.innerHTML = "";
  if (!candidates.length) {
    box.innerHTML = '<div class="cand-empty">从左边勾选景点，或用「随机选」抽几个进来</div>';
    return;
  }
  candidates.forEach(d => {
    const item = document.createElement("div");
    item.className = "cand-item";
    item.innerHTML =
      '<div><span class="cand-name">' + d.name + '</span><br>' +
      '<span class="cand-meta">' + d.city + ' · ' + d.distance + ' km</span></div>';
    const del = document.createElement("button");
    del.className = "cand-del";
    del.textContent = "✕";
    del.title = "移出待选区";
    del.onclick = () => toggleCand(d, false);
    item.appendChild(del);
    box.appendChild(item);
  });
}

// ---------- 随机抽 X 个 ----------
function randPick() {
  const pool = filtered().filter(d => !inCands(d));
  if (!pool.length) { alert("当前筛选结果都已经在待选区里啦～"); return; }
  let x = parseInt(document.getElementById("randCount").value) || 1;
  x = Math.min(Math.max(x, 1), pool.length);
  // Fisher-Yates 洗牌：每个排列等概率，替代有偏的 sort(() => Math.random() - 0.5)
  const shuffled = pool.slice();
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  const picked = shuffled.slice(0, x);
  picked.forEach(d => candidates.push(d));
  saveCands();
  render();
}

// ---------- 联网搜索（本地无结果时，查 OpenStreetMap 开放数据） ----------
const SJZ_COORD = [38.0422, 114.5144]; // 石家庄市区
function haversine(lat1, lon1, lat2, lon2) {
  const rad = Math.PI / 180, Rk = 6371;
  const dLat = (lat2 - lat1) * rad, dLon = (lon2 - lon1) * rad;
  const s = Math.sin(dLat/2)**2 + Math.cos(lat1*rad)*Math.cos(lat2*rad)*Math.sin(dLon/2)**2;
  return 2 * Rk * Math.asin(Math.sqrt(s));
}
function classifyWeb(r) {
  const t = (r.type || "") + (r.class || "");
  if (/museum|monument|castle|artwork|gallery|temple|memorial|ruins|fort|archaeolog|city_gate|citywall/.test(t)) return "历史人文";
  if (/park|garden|zoo|aquarium|playground/.test(t)) return "亲子休闲";
  if (/waterfall|peak|volcano|cave|beach|bay|lake|river|mountain|nature|geyser|hot_spring/.test(t)) return "自然山水";
  if (/hotel|resort/.test(t)) return "温泉度假";
  if (/village|town/.test(t)) return "古镇古村";
  return "其他";
}
function normalizeWebItem(r) {
  const a = r.address || {};
  const state = (a.state || "").replace(/省$/, "");
  const pref = (a.city || a.county || "").replace(/市$/, "");
  const dist = (a.county || a.suburb || a.city_district || a.town || a.village || "").replace(/市$/, "");
  let city = dist || pref || state || "未知地区";
  if (state === "山西") city = "山西" + city;
  else if (state === "河南") city = "河南" + city;
  const distance = Math.round(haversine(SJZ_COORD[0], SJZ_COORD[1], +r.lat, +r.lon));
  const et = r.extratags || {};
  const fee = et.charge || et.fee || "";
  return {
    name: ((r.name || "").trim()) || r.display_name.split(",")[0].trim(),
    city: city,
    type: classifyWeb(r),
    features: (et.description || r.display_name).slice(0, 80),
    distance: distance,
    drive: Math.max(10, Math.round(distance * 0.8)),
    days: distance < 60 ? 1 : distance < 220 ? 2 : 3,
    ticket: fee || "未知（自行核实）",
    isFree: /^no$/i.test(fee) || /免费/.test(fee),
    note: "OSM 网络数据 · 出行前请核实",
    _lat: +r.lat, _lon: +r.lon
  };
}
let webCache = { kw: "", items: [] };
function webResultsHTML(items) {
  const fresh = items.filter(d => !DATA.some(x => x.name === d.name));
  if (!fresh.length) return '<div class="empty-tip">🌐 网上的结果都已加入本地数据啦</div>';
  return fresh.map(d => {
    const i = webCache.items.indexOf(d);
    return '<div class="card pickable"><div><div class="name">🌐 ' + d.name + '</div>' +
      '<div class="meta"><span class="tag">' + d.type + '</span><span class="tag">' + d.city + '</span><br>' +
      d.features + '</div></div>' +
      '<div class="dist-box"><div class="dist">' + d.distance + ' km</div>' +
      '<button class="btn btn-rand" data-web="' + i + '" style="margin-top:6px;padding:5px 14px;font-size:12.5px;">➕ 加入</button></div></div>';
  }).join("") + '<div class="empty-tip">🌐 来自 OpenStreetMap 开放数据 · 点「加入」保存到本地（刷新不丢失）</div>';
}
function bindWebButtons() {
  document.querySelectorAll("#resultList [data-web]").forEach(btn => {
    btn.onclick = () => addCustom(webCache.items[+btn.dataset.web]);
  });
}
async function webSearch(kw) {
  try {
    const url = "https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&extratags=1&limit=8&accept-language=zh-CN&bounded=1&viewbox=110,43,119,31.5&q=" + encodeURIComponent(kw);
    const res = await fetch(url);
    if (!res.ok) throw new Error(res.status);
    const arr = await res.json();
    const items = arr.filter(r => ["tourism", "leisure", "historic", "natural"].includes(r.class)).map(normalizeWebItem);
    webCache = { kw: kw, items: items };
    const box = document.getElementById("webBox");
    if (box) {
      box.innerHTML = items.length ? webResultsHTML(items) : '<div class="empty-tip">🌐 网上也没查到，换个关键字试试</div>';
      bindWebButtons();
    }
  } catch (e) {
    const box = document.getElementById("webBox");
    if (box) box.innerHTML = '<div class="empty-tip">🌐 联网查询失败，请检查网络后重试</div>';
  }
}
function addCustom(d) {
  if (!d || DATA.some(x => x.name === d.name)) return;
  DATA.push(d);
  customData.push(d);
  try { localStorage.setItem("sjz_custom_data", JSON.stringify(customData)); } catch (e) {}
  // 类型下拉框补充新类型
  const cur = typeSel.value;
  typeSel.innerHTML = '<option value="all">全部类型</option>';
  [...new Set(DATA.map(x => x.type))].forEach(t => typeSel.add(new Option(t, t)));
  typeSel.value = [...typeSel.options].some(o => o.value === cur) ? cur : "all";
  render();
}

// ---------- 转盘 ----------
const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");
const SIZE = 800, CX = SIZE/2, CY = SIZE/2, R = SIZE/2 - 8;
const COLORS = ["#2f6f4f","#56a379","#8cbfa3","#e0a13f","#e07a3f","#c9605a","#7a6ea8","#4f8fb5","#6da34d","#b58a3d"];
let wheelItems = [], angle = 0, spinning = false, spinWinner = null;
let particles = [], curSpeed = 0, lastAngle = angle, lastTime = 0, winFlash = 0;
let spinId = 0; // 动画令牌：新的一次旋转会让旧的动画循环自动作废

// 预渲染的发光火花贴图：一次画好，之后每帧只是贴图，比逐颗 shadowBlur 快几十倍
const sparkSprite = (function () {
  const c = document.createElement("canvas");
  c.width = c.height = 32;
  const s = c.getContext("2d");
  const g = s.createRadialGradient(16, 16, 0, 16, 16, 16);
  g.addColorStop(0, "rgba(255,255,255,1)");
  g.addColorStop(0.3, "rgba(255,225,140,0.95)");
  g.addColorStop(0.65, "rgba(255,180,80,0.55)");
  g.addColorStop(1, "rgba(255,160,60,0)");
  s.fillStyle = g;
  s.fillRect(0, 0, 32, 32);
  return c;
})();

// 底图缓存：扇区和文字只在内容变化时画一次，每帧只做"贴图+旋转"，帧率稳
const baseCanvas = document.createElement("canvas");
baseCanvas.width = baseCanvas.height = SIZE;
const bctx = baseCanvas.getContext("2d");
let baseKey = "";

function drawWheel(items) {
  wheelItems = items.slice(0, WHEEL_CAP);
  setCapHint(document.getElementById("wheelCapHint"), items.length);
  document.getElementById("wheelEmpty").style.display = items.length ? "none" : "flex";
  document.getElementById("spinBtn").disabled = !items.length || spinning;
  ctx.clearRect(0, 0, SIZE, SIZE);
  const n = wheelItems.length;
  if (!n) { baseKey = ""; return; }
  const key = n + "|" + wheelItems.map(d => d.name).join("|");
  if (key !== baseKey) { buildBase(n); baseKey = key; }
  ctx.save();
  ctx.translate(CX, CY);
  ctx.rotate(angle);
  ctx.drawImage(baseCanvas, -CX, -CY);
  ctx.restore();
  drawFX();
}

function buildBase(n) {
  bctx.clearRect(0, 0, SIZE, SIZE);
  const arc = Math.PI * 2 / n;
  for (let i = 0; i < n; i++) {
    const start = i * arc;
    bctx.beginPath();
    bctx.moveTo(CX, CY);
    bctx.arc(CX, CY, R, start, start + arc);
    bctx.fillStyle = COLORS[i % COLORS.length];
    bctx.fill();
    bctx.strokeStyle = "#fff";
    bctx.lineWidth = 2;
    bctx.stroke();
    // 文字
    bctx.save();
    bctx.translate(CX, CY);
    bctx.rotate(start + arc / 2);
    bctx.textAlign = "right";
    bctx.fillStyle = "#fff";
    const label = wheelItems[i].name.length > 10 ? wheelItems[i].name.slice(0, 10) + "…" : wheelItems[i].name;
    // 按扇区角度和字数自适应字号：径向放得下、弧向不挤出扇区，尽量占满
    const chars = label.length;
    let fs = Math.min(46, (R - 16) / (chars + 0.6 + 1 / (0.9 * arc)));
    fs = Math.max(Math.round(fs), 14);
    bctx.font = "bold " + fs + "px 'Microsoft YaHei'";
    bctx.shadowColor = "rgba(0,0,0,.3)";
    bctx.shadowBlur = 2;
    bctx.textBaseline = "middle";
    bctx.fillText(label, R - 12, 0);
    bctx.restore();
  }
  bctx.beginPath();
  bctx.arc(CX, CY, R, 0, Math.PI * 2);
  bctx.strokeStyle = "#2f6f4f";
  bctx.lineWidth = 4;
  bctx.stroke();
}

// ---------- 光影特效 ----------
function drawFX() {
  const now = performance.now();
  // 1) 高速拖影：随旋转飘出的白色残影弧线
  if (spinning && curSpeed > 6) {
    const intensity = Math.min((curSpeed - 6) / 30, 1);
    ctx.save();
    ctx.globalAlpha = 0.12 + 0.25 * intensity;
    ctx.strokeStyle = "#fff8e0";
    ctx.lineCap = "round";
    for (let i = 0; i < 3; i++) {
      const a = angle - i * 0.2;
      ctx.beginPath();
      ctx.arc(CX, CY, R - 3 - i * 2, a - 0.6, a);
      ctx.lineWidth = 6 - i * 1.5;
      ctx.stroke();
    }
    ctx.restore();
  }
  // 2) 外圈金色流光（旋转时呼吸闪烁）
  if (spinning) {
    const pulse = 0.55 + 0.45 * Math.sin(now / 90);
    ctx.save();
    ctx.globalAlpha = 0.5 * pulse;
    ctx.strokeStyle = "#ffd97a";
    ctx.shadowColor = "#ffb84d";
    ctx.shadowBlur = 18;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(CX, CY, R + 2, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }
  // 3) 火花粒子（贴图渲染，无实时辉光开销）
  ctx.save();
  for (const p of particles) {
    ctx.globalAlpha = Math.max(p.life / p.maxLife, 0);
    const s = p.size * 7;
    ctx.drawImage(sparkSprite,
      CX + Math.cos(p.a) * p.r - s / 2,
      CY + Math.sin(p.a) * p.r - s / 2, s, s);
  }
  ctx.restore();
  // 4) 中奖金光扩散波纹
  if (winFlash > 0) {
    const k = 1 - winFlash;
    ctx.save();
    ctx.globalAlpha = winFlash;
    ctx.strokeStyle = "#ffcf6b";
    ctx.shadowColor = "#ffb84d";
    ctx.shadowBlur = 25;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(CX, CY, R * (0.5 + 0.6 * k), 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }
}

function updateParticles(dt) {
  for (const p of particles) { p.r += p.vr * dt; p.a += p.va * dt; p.life -= dt; }
  particles = particles.filter(p => p.life > 0 && p.r < R + 70);
}

function spawnSparks(count, speed) {
  if (particles.length > 160) return;
  for (let i = 0; i < count; i++) {
    const life = 0.5 + Math.random() * 0.6;
    particles.push({
      a: Math.random() * Math.PI * 2,
      r: R - 6 + Math.random() * 8,
      vr: 60 + Math.random() * 140 * Math.min(speed / 30, 1.5),
      va: (Math.random() - 0.5) * 1.2,
      size: 0.8 + Math.random() * 1.6,
      life: life, maxLife: life
    });
  }
}

function spin() {
  if (spinning || !wheelItems.length) return;
  spinning = true;
  spinWinner = null;
  particles = [];
  document.getElementById("spinBtn").disabled = true;
  document.getElementById("winnerBox").innerHTML = "";
  document.querySelector(".wheel-wrap").classList.add("spinning");
  const idx = Math.floor(Math.random() * wheelItems.length);
  const n = wheelItems.length;
  const arc = Math.PI * 2 / n;
  // 指针在正上方（-PI/2），中奖扇区中心要对准它
  const targetCenter = -Math.PI / 2 - idx * arc - arc / 2;
  const extraTurns = 13 + Math.floor(Math.random() * 4); // 13~16 圈，配合 10 秒
  const startAngle = angle;
  // 归一化：让最终角度 = targetCenter - 2π*extraTurns（多转几圈）
  const total = targetCenter - startAngle + Math.PI * 2 * extraTurns;
  const duration = 10000; // 转 10 秒
  const t0 = performance.now();
  const myId = ++spinId; // 本次旋转的令牌

  // 慢 → 快 → 慢，且对比更强烈的节奏曲线
  function easeInOutQuart(t) {
    return t < 0.5 ? 8 * t * t * t * t : 1 - Math.pow(-2 * t + 2, 4) / 2;
  }

  lastAngle = startAngle;
  lastTime = t0;

  function frame(now) {
    if (myId !== spinId) return; // 已有新的一次旋转，旧循环作废
    const t = Math.min((now - t0) / duration, 1);
    angle = startAngle + total * easeInOutQuart(t);
    const dt = Math.max((now - lastTime) / 1000, 0.001);
    curSpeed = Math.abs(angle - lastAngle) / dt; // 实时角速度
    lastAngle = angle;
    lastTime = now;
    // 转得越快，迸出的火花越多
    if (curSpeed > 5 && Math.random() < Math.min(curSpeed / 25, 1)) {
      spawnSparks(Math.floor(curSpeed / 6), curSpeed);
    }
    updateParticles(dt);
    drawWheel(wheelItems);
    if (t < 1) {
      requestAnimationFrame(frame);
    } else {
      // 停下：金光扩散 + 火花迸发
      curSpeed = 0;
      spinning = false;
      winFlash = 1;
      angle = angle % (Math.PI * 2); // 角度归一化，防止多次旋转后数值膨胀
      document.querySelector(".wheel-wrap").classList.remove("spinning");
      const wrap = document.querySelector(".wheel-wrap");
      wrap.classList.add("flash");
      setTimeout(() => wrap.classList.remove("flash"), 2100);
      document.getElementById("spinBtn").disabled = false;
      spawnSparks(40, 30);
      const d = wheelItems[idx];
      document.getElementById("winnerBox").innerHTML =
        '<div class="w-card">🎉 就决定是你了！<div class="w-name">' + d.name + '</div>' +
        '<div class="w-info">' + d.city + ' · ' + d.type + ' · 距离 ' + d.distance +
        ' km · 建议' + (d.days < 1 ? "半天" : d.days + " 天") + '游<br>' + d.features + '</div></div>';
      document.getElementById("panelWinner").innerHTML =
        '上次转中：<b>' + d.name + '</b>（' + d.city + ' · ' + d.distance + ' km）';
      // 让金光和余烬粒子飘完再收尾
      requestAnimationFrame(flashFrame);
    }
  }

  function flashFrame(now) {
    if (myId !== spinId) return; // 已有新的一次旋转，旧循环作废
    const dt = Math.max((now - lastTime) / 1000, 0.001);
    lastTime = now;
    winFlash = Math.max(winFlash - dt / 1.4, 0);
    updateParticles(dt);
    drawWheel(wheelItems);
    if (winFlash > 0 || particles.length) requestAnimationFrame(flashFrame);
  }
  requestAnimationFrame(frame);
}

// ---------- 全屏弹窗 ----------
const wheelModal = document.getElementById("wheelModal");
// 用 JS 精确设定转盘为正方形：任何浏览器、任何窗口尺寸下都保证是正圆
function fitWheel() {
  const s = Math.max(280, Math.min(window.innerWidth * 0.92, window.innerHeight - 180, 880));
  const wrap = document.querySelector(".wheel-wrap");
  wrap.style.width = s + "px";
  wrap.style.height = s + "px";
}
window.addEventListener("resize", fitWheel);
fitWheel();
function openWheelModal(autoSpin) {
  wheelModal.classList.add("open");
  document.body.style.overflow = "hidden"; // 背景页面不滚动
  if (autoSpin && !spinning && wheelItems.length) spin();
}
function closeWheelModal() {
  if (spinning) { alert("转盘正在飞转中，等它停下来再关吧～"); return; }
  wheelModal.classList.remove("open");
  document.body.style.overflow = "";
}
document.getElementById("openSpinBtn").onclick = () => openWheelModal(true);
document.getElementById("modalClose").onclick = closeWheelModal;
document.addEventListener("keydown", e => { if (e.key === "Escape") closeWheelModal(); });

// ---------- 事件绑定 ----------
provinceSel.onchange = e => {
  state.province = e.target.value;
  state.city = "all";
  refreshCityOptions();
  render();
};
citySel.onchange = e => { state.city = e.target.value; render(); };
typeSel.onchange = e => { state.type = e.target.value; render(); };
document.getElementById("distRange").oninput = e => {
  state.maxDist = +e.target.value;
  document.getElementById("distVal").textContent = state.maxDist + " km";
  render();
};
document.getElementById("daysSelect").onchange = e => { state.days = e.target.value; render(); };
document.getElementById("searchBox").oninput = e => { state.search = e.target.value.trim(); render(); };
document.getElementById("freeOnly").onchange = e => { state.freeOnly = e.target.checked; render(); };
document.getElementById("randPickBtn").onclick = randPick;
document.getElementById("spinBtn").onclick = spin;
document.getElementById("resetBtn").onclick = () => {
  state.province = "all"; state.city = "all"; state.type = "all";
  state.maxDist = 700; state.days = "all"; state.search = ""; state.freeOnly = false;
  provinceSel.value = "all"; typeSel.value = "all";
  refreshCityOptions();
  document.getElementById("distRange").value = 700;
  document.getElementById("distVal").textContent = "700 km";
  document.getElementById("daysSelect").value = "all";
  document.getElementById("searchBox").value = "";
  document.getElementById("freeOnly").checked = false;
  render();
};

render();
</script>
